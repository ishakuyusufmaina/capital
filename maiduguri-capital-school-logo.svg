<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Maiduguri Capital School logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Maiduguri Capital School</title>
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3db0f2"/>
      <stop offset="1" stop-color="#1673c4"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <g font-family="'Open Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" fill="#1f78b4" text-anchor="middle">
    <text x="256" y="58" font-size="46" textLength="412" lengthAdjust="spacingAndGlyphs">MAIDUGURI CAPITAL</text>
    <text x="256" y="98" font-size="46" textLength="170" lengthAdjust="spacingAndGlyphs">SCHOOL</text>
  </g>

  <!-- Rings -->
  <circle cx="257" cy="252" r="146" fill="#fff" stroke="#1f78b4" stroke-width="6"/>
  <circle cx="257" cy="252" r="130" fill="none" stroke="#1f78b4" stroke-width="3"/>

  <!-- Cross -->
  <path d="M257 122V382M127 252H387" stroke="#1f78b4" stroke-width="3"/>

  <!-- Top-left: graduation cap -->
  <path d="M182 198v15q23 13 46 0v-15z" fill="#1c2f45"/>
  <polygon points="163,190 205,172 247,190 205,208" fill="#2b4560"/>
  <polygon points="163,190 205,208 205,212 163,194" fill="#1c2f45" opacity=".6"/>
  <path d="M172 192v26" stroke="#f2b632" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="169" y="217" width="6" height="12" rx="2" fill="#f2b632"/>

  <!-- Top-right: stacked books -->
  <rect x="266" y="217" width="78" height="16" rx="2" fill="#3e6b8f"/>
  <rect x="268" y="228" width="74" height="3.5" fill="#f5efd9"/>
  <rect x="270" y="201" width="72" height="16" rx="2" fill="#e0d2a8"/>
  <rect x="272" y="212" width="68" height="3.5" fill="#fff"/>
  <rect x="266" y="185" width="76" height="16" rx="2" fill="#4d8f5e"/>
  <rect x="268" y="196" width="72" height="3.5" fill="#f5efd9"/>
  <rect x="274" y="170" width="60" height="15" rx="2" fill="#c0392b"/>
  <rect x="276" y="180" width="56" height="3.5" fill="#f5efd9"/>

  <!-- Bottom-left: laptop -->
  <rect x="166" y="260" width="68" height="46" rx="4" fill="#2b3a4a"/>
  <rect x="171" y="265" width="58" height="36" rx="1.5" fill="url(#scr)"/>
  <path d="M155 307h90l-5 9H160z" fill="#aab4be"/>
  <rect x="155" y="306" width="90" height="3" rx="1.5" fill="#6b7885"/>

  <!-- Bottom-right: pencil and pen -->
  <g transform="translate(285,290) rotate(35)">
    <rect x="-5" y="-28" width="10" height="44" rx="2.5" fill="#f5c542"/>
    <rect x="-1" y="-28" width="3" height="44" fill="#fbe08a"/>
    <polygon points="-5,16 5,16 0,29" fill="#f2d6a2"/>
    <polygon points="-1.8,24.6 1.8,24.6 0,29" fill="#333"/>
  </g>
  <g transform="translate(333,282) rotate(35)">
    <rect x="-5" y="-30" width="10" height="46" rx="4" fill="#2e86d4"/>
    <rect x="-1" y="-30" width="3" height="46" fill="#6fb2ec"/>
    <rect x="-7" y="-32" width="3" height="16" rx="1.5" fill="#1d5f9c"/>
    <polygon points="-5,16 5,16 0,30" fill="#4a5a6a"/>
  </g>

  <!-- Side ribbons -->
  <g transform="translate(122,368) rotate(40)">
    <polygon points="-76,-20 76,-20 64,0 76,20 -76,20 -64,0" fill="#fff" stroke="#1f78b4" stroke-width="4" stroke-linejoin="miter"/>
    <text y="8" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#1f78b4" text-anchor="middle" textLength="96" lengthAdjust="spacingAndGlyphs">SEEK FOR</text>
  </g>
  <g transform="translate(394,364) rotate(-40)">
    <polygon points="-76,-20 76,-20 64,0 76,20 -76,20 -64,0" fill="#fff" stroke="#1f78b4" stroke-width="4" stroke-linejoin="miter"/>
    <text y="8" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#1f78b4" text-anchor="middle" textLength="96" lengthAdjust="spacingAndGlyphs">AS CHINA</text>
  </g>

  <!-- Bottom label -->
  <rect x="162" y="421" width="188" height="50" fill="#fff" stroke="#1f78b4" stroke-width="4"/>
  <text x="256" y="453" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#1f78b4" text-anchor="middle" textLength="150" lengthAdjust="spacingAndGlyphs">KNOWLEDGE AS FAR</text>
</svg>
