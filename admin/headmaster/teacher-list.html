<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <title>Teachers - Name, Username, Password</title>
  <style>
  *{
    box-sizing: border-box;
  }
    body {
      background-color: #f4f7fa;
        font-family: Arial, sans-serif;
      padding: 20px;
    }
  select {
       font-family: Arial, sans-serif;

    form {
      max-width: 800px;

    input {
      padding: 8px;
      border: 1px solid #333;
      border-radius: 5px;
  
    }

    

    .p-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td{
      padding: 10px;
      border: 1px solid #333;
      text-align: center;
    }
 h1, .save-container {
    display: inline-block;
 }
  .save-container {
    float: right;
  }

    .center {
      text-align: center;
      margin-top: 15px;
    }
  
  
    .p-table {
  min-width: 600px; /* ensures large enough width for scrolling */
}

.table-container {
  overflow-x: auto;
  margin: 30px auto;
}
  
  .subject > select {
    width: 100%;
    border: none;
    text-align: right;
    margin-bottom: 0;
    margin-top: 20px;
    border: 0.5px solid;
    border-top: none;
    border-radius: 18px;
   
   
  }
#subjHead {
  text-align: center;
}
  
  .cell-table * {
      
      border-collapse: collapse;
      margin-top: 20px;
    border: none;
    }
button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.7rem;
      background-color: #3f51b5;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #5c6bc0;
    }
  
  button.delete {
  background-color: #dc3545;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}

button.delete:hover {
  background-color: #c82333;
}
  
  
  
  
/* Modal background overlay */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5); /* semi-transparent background */
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  display: none;
}

/* Modal content styling */
.modal-content {
  border: none;
  border-radius: 10px;
  padding: 2rem;
  background: #fff;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  min-width: 300px;
  max-width: 90%;
}

/* Header */
.modal-content h3 {
  margin-top: 0;
  font-size: 1.5rem;
  color: #333;
}

/* Inputs */
.modal-content input {
  width: 100%;
  padding: 0.5rem;
  margin-top: 1rem;
  margin-bottom: 1rem;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 1rem;
}

/* Buttons */
.modal-content button {
  color: white;
  padding: 0.6rem 1.2rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
  margin-top: 1rem;
  width: fit-content;
}

/* Close Button styling (optional) */
#closeBtn {
  width: fit-content;
  background-color: #f44336;
  float: right;
  margin-bottom: 1rem;
}

/* Add hover effect */
.modal-content button:hover {
  opacity: 0.9;
}
  
  #message {
    display: none;
    color: green;
  }
  .show#message {
    display: block;
  }
  .error#message {
    color: red;

      }
  
  a {
    font-size: 1.2rem;
    color: #4a90e2;
  }

  
  .modal-content select {
    width: 100%;
    padding: 0.5rem;
    margin-top: 1rem;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 1rem;
  }
  </style>
</head>
<body>
  <a href="admin.html"><i class="fas fa-home"></i></a>

  <h1>Teachers</h1>
  <div class="save-container" >
      <button id="save">Save</button>
    </div>
  <div id="teacherForm" >
    <div class="table-container">
    <table class="p-table">
      <thead>
        <tr>
          <th>SN</th>
          <th>Name</th>
          <!--th id="subjHead"> 
            <table>
              <tr>
                <th>Subject</th>
                <th>Class</th>
              </tr>
            </table>
          </th-->
          <th>Username</th>
          
          <!--th>Password</th-->
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="fieldContainer">
        
      </tbody>
    </table>
  </div>
    <div>
      <button type="button" id="add" onclick="addField()">Add Teacher</button>
    </div>
       
  </form>
  
  
  
      <!-- Modal -->
  <div id="modal" class="modal">
  <dialog open class="modal-content">
   <h3>Create Teacher Account</h3>
    <p id="message">message</p>
    <select id="sectionIn"></select>
    <br>
    <input id="nameIn" placeholder="Name">
    <br>
    <input id="usernameIn" placeholder="Username">
    <br>
    <button id="createBtn">Create</button>
    <button id="closeBtn">Close</button>

  </dialog>
</div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
  import {getFirestore, doc, getDoc, collection, writeBatch, updateDoc, arrayUnion, arrayRemove, FieldPath} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import {getAuth, signOut, onAuthStateChanged, createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
     // import {getDatabase, set, ref, onValue, child, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
 const firebaseConfig = {
  apiKey: "AIzaSyCm_DSZaYVQCt0ubBwRkE9nOTryJayxH0w",
  authDomain: "school-in-the-box.firebaseapp.com",
  projectId: "school-in-the-box",
  storageBucket: "school-in-the-box.firebasestorage.app",
  messagingSenderId: "596350496353",
  appId: "1:596350496353:web:84c66c351700ddf0824420",
  measurementId: "G-3MGCDH4FRF"
};


  const schoolId = "capital";
  const test = true;
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const db = getFirestore(app);


 add.textContent = "Loading..";
 const user = await new Promise(resolve=> onAuthStateChanged(auth, user=>resolve(user)));
 if (!user) {
   window.location.href = "../signin.html";
   throw new Error("Not signed in");
 }
 let headId = user.email.replace(/@.*/, "");

  // Teacher accounts: capital/db/teachersV2/{teacherId}
  // (only read for the head's own record, and checked when creating an account)
  const teachersCol = collection(db, schoolId, "db", "teachersV2");
  async function getTeacher(id) {
    const snap = await getDoc(doc(teachersCol, id));
    return snap.exists() ? snap.data() : null;
  }

  const sectionRef = doc(db, schoolId, "section");
  const sectionDoc = await getDoc(sectionRef);

  const head = await getTeacher(headId);
  if (!head) {
    alert("Your account record was not found. Talk to your admin.");
    throw new Error("Head record not found");
  }
  const rsects = head.role?.hos?.sections ?? [];
  const sections = sectionDoc.exists() ? sectionDoc.data() : {}; // object: sectionId => section
  const mySections = rsects.filter(key=> sections[key]);

  // One entry per (section, teacher) pair. The list shown is built from these:
  //   section.teachers = [{id, name}, ...]
  // elem is the exact object stored in the section, which arrayRemove needs.
  const entries = [];
  const toRemove = [];            // saved entries removed on this page: delete on Save
  const newRecords = new Map();   // id -> account record to create on Save

  mySections.forEach(sk=>{
    (sections[sk].teachers ?? []).forEach(t=>{
      entries.push({ sectionKey: sk, elem: t, saved: true });
    });
  });

  // Section choices for the "create" dialog
  mySections.forEach(sk=>{
    const opt = document.createElement("option");
    opt.value = sk;
    opt.textContent = sections[sk].name ?? sk;
    sectionIn.append(opt);
  });

  function flash(text, isError){
    message.textContent = text;
    message.classList.add("show");
    message.classList.toggle("error", !!isError);
    setTimeout(_=>message.classList.remove("show", "error"), 2500);
  }

  function presentTeachers(){
    let container = document.getElementById('fieldContainer');
    container.innerHTML = "";
    // one row per teacher, even if listed in several of the head's sections
    const byId = new Map();
    entries.forEach(en=>{
      const id = String(en.elem.id);
      if (!byId.has(id)) byId.set(id, { name: en.elem.name ?? id, username: id });
    });
    [...byId.values()]
      .sort((a, b) => String(a.name).localeCompare(String(b.name)))
      .forEach(t=> addField(t));
  }


 presentTeachers();

  add.textContent = "New Teacher";
  save.onclick = async e=>{
    const adds = entries.filter(en=> !en.saved);
    if (!newRecords.size && !toRemove.length && !adds.length) {
      save.innerHTML = "No changes";
      setTimeout(_=>save.innerHTML = "Save", 1500);
      return;
    }

    save.innerHTML = "Saving..";
    try {
      // 1. account records for brand-new teachers
      if (newRecords.size) {
        const batch = writeBatch(db);
        newRecords.forEach((record, id)=> batch.set(doc(teachersCol, id), record));
        await batch.commit();
        newRecords.clear();
      }
      // 2. take removed teachers out of their sections
      if (toRemove.length) {
        await changeSectionTeachers(toRemove, arrayRemove);
        toRemove.length = 0;
      }
      // 3. put added teachers into their sections
      if (adds.length) {
        await changeSectionTeachers(adds, arrayUnion);
        adds.forEach(en=> en.saved = true);
      }
      save.innerHTML = "Saved!";
    } catch (err) {
      console.error(err);
      save.innerHTML = "Failed: " + (err.code || err.message);
    }
    setTimeout(_=>save.innerHTML = "Save", 2500);
  }

  // arrayUnion / arrayRemove edit just the listed elements of section.teachers,
  // so nobody else's changes to the section are overwritten.
  async function changeSectionTeachers(items, op) {
    const bySection = new Map();
    items.forEach(it=>{
      if (!bySection.has(it.sectionKey)) bySection.set(it.sectionKey, []);
      bySection.get(it.sectionKey).push(it.elem);
    });
    const args = [];
    bySection.forEach((elems, sk)=> args.push(new FieldPath(sk, "teachers"), op(...elems)));
    await updateDoc(sectionRef, ...args);
  }

  usernameIn.oninput = e=>{
    let val = usernameIn.value;
    val = val.replaceAll(" ", "").replaceAll("/", "").toLowerCase();
    usernameIn.value=val;
  }

  add.onclick =  e=>{
    if (!mySections.length) {
      alert("You are not head of any section.");
      return;
    }
    openModal();
    createBtn.onclick = async e=>{
      let name = nameIn.value.trim();
      let username = usernameIn.value;
      let sk = sectionIn.value;
      if (!username) return;
      if (!name) return;
      if (!sk) return;

      createBtn.disabled = true;
      try {
        if (entries.some(en=> String(en.elem.id) === username && en.sectionKey === sk)) {
          flash(username + " is already in this section!", true);
          return;
        }

        // Does this username already have an account? (checked in Firestore, not just this list)
        let existing = newRecords.get(username) ?? await getTeacher(username);
        let finalName = existing?.name ?? name;
        if (!existing) newRecords.set(username, {
          name: name,
          psw: "123456",
          username: username,
          load: {}
        });

        // Re-adding something removed earlier on this page just cancels the removal
        const k = toRemove.findIndex(r=> r.sectionKey === sk && String(r.elem.id) === username);
        if (k >= 0) entries.push({ ...toRemove.splice(k, 1)[0] });
        else entries.push({ sectionKey: sk, elem: { id: username, name: finalName }, saved: false });

        presentTeachers();
        nameIn.value="";
        usernameIn.value = "";
        flash(existing
          ? `${username} already has an account (${existing.name}). Added to the section, press Save.`
          : `${name}'s account has been created! Press Save to keep it.`);
      } catch (err) {
        flash("Could not add teacher: " + (err.code || err.message), true);
      } finally {
        createBtn.disabled = false;
      }
    }

    closeBtn.onclick = closeModal;

  }

    function addField(teacher) {
      const container = document.getElementById('fieldContainer');
      const row = document.createElement('tr');
      row.classList.add("entry");

      let name = teacher.name;
      let psw = teacher.psw;
      let username = teacher.username;

      row.innerHTML = `
       <td class="sn"></td>
          <td><input type="text" disabled class="name" value="${name}" name="name" placeholder="Name"></td>
          <td class="username"><input disabled value="${username}" class="username" name="username" placeholder="Username"></td>
          <td><button class="assign">assign</button><button class="delete" type="button" onclick="deleteField(this)">remove</button></td>
          `;

      container.appendChild(row);
       row.querySelector(".sn").textContent = container.children.length;
      row.querySelector(".assign").onclick = e=> window.location.href = `teacher.html?username=${username}`;

      row.querySelector(".delete").onclick = e=>deleteField(e.target);

       }

    // Removing takes the teacher out of your section(s). Their account record is NOT deleted.
    function deleteField(btn) {
      const row = btn.closest('tr');
      let username = row.querySelector(".username > input").value;
      let name = row.querySelector(".name").value;
      if (!confirm(`Remove ${name} from your section${mySections.length > 1 ? "s" : ""}? Press Save to apply. Their account is kept.`)) return;
      for (let i = entries.length - 1; i >= 0; i--) {
        const en = entries[i];
        if (String(en.elem.id) !== username) continue;
        entries.splice(i, 1);
        if (en.saved) toRemove.push(en);   // already in the section: remove on Save
      }
      // Created here and never saved: nothing to create any more
      if (!entries.some(en=> String(en.elem.id) === username)) newRecords.delete(username);
      presentTeachers();
    }

    function openModal() {
    modal.style = "display: block";
  }

    function closeModal() {
      document.getElementById("modal").style = "display: none";
    }



</script>
</body>
</html>
