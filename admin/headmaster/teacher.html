<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>Subject load</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb; --surface: #ffffff; --text: #1c2433; --muted: #667085;
      --border: #e1e6ef; --primary: #3f51b5; --primary-hover: #34429a; --primary-soft: #e8ebfa;
      --danger: #c62828; --danger-soft: #fdecea; --success: #1b7f4b; --warn: #9a5b00; --warn-soft: #fff1d6;
      --shadow: 0 6px 20px rgba(16, 24, 40, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c; --surface: #1b2030; --text: #e8ecf5; --muted: #9aa4b8;
        --border: #2c3347; --primary: #6577e6; --primary-hover: #7a8aee; --primary-soft: #262d4d;
        --danger: #ef6b6b; --danger-soft: #3a2024; --success: #4cc38a; --warn: #f0b860; --warn-soft: #382c14;
        --shadow: 0 6px 20px rgba(0, 0, 0, .5);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.4;
    }
    .page { max-width: 960px; margin: 0 auto; padding: 16px 16px 110px; }

    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .header h1 { font-size: 1.5rem; margin: 0; flex: 1; }
    .back {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
      color: var(--primary); background: var(--surface); border: 1px solid var(--border); text-decoration: none;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; font-size: .95rem; font-weight: 500;
      cursor: pointer; text-decoration: none; transition: background .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: var(--primary-soft); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn.danger:hover:not(:disabled) { background: var(--danger); opacity: .9; }
    .btn.small { padding: 4px 10px; font-size: .8rem; }
    .btn:focus-visible, input:focus-visible, .back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .who {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .avatar {
      flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
      background: var(--primary-soft); color: var(--primary); font-weight: 700;
    }
    .who-name { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
    .who-meta { color: var(--muted); font-size: .9rem; }

    .notice { padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; font-size: .95rem; }
    .notice.error { background: var(--danger-soft); color: var(--danger); }
    .notice.info { background: var(--primary-soft); }

    .toolbar { margin-bottom: 12px; position: relative; }
    .toolbar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    input[type=search] {
      width: 100%; padding: 10px 12px 10px 36px; font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .card.active { border-color: var(--primary); }
    .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .card-title { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
    .count { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 600; white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .chip span {
      display: block; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
      font-size: .9rem; user-select: none; transition: background .12s, color .12s;
    }
    .chip input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
    .chip input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
    .chip:hover input:not(:checked) + span { background: var(--primary-soft); }

    .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }
    .skeleton { height: 120px; border-radius: 12px; border: 1px solid var(--border); background: linear-gradient(90deg, var(--surface), var(--primary-soft), var(--surface)); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .savebar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
      border-top: 1px solid var(--border); box-shadow: 0 -4px 16px rgba(16, 24, 40, .08);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .savebar-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .savebar-inner span { flex: 1; font-weight: 500; }

    dialog { border: none; border-radius: 16px; padding: 0; width: calc(100% - 32px); max-width: 420px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(10, 14, 24, .55); }
    .dlg { padding: 22px; }
    .dlg h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .dlg p { margin: 0 0 14px; color: var(--muted); }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100; display: grid; gap: 8px; width: min(420px, calc(100% - 24px)); pointer-events: none; }
    .toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); animation: toast-in .2s ease-out; pointer-events: auto; }
    .toast.out { opacity: 0; transform: translateY(-6px); transition: .25s; }
    .toast.success i { color: var(--success); } .toast.error i { color: var(--danger); } .toast.info i { color: var(--primary); }
    .toast.error { border-color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <a class="back" href="teacher-list.html" aria-label="Back to teachers"><i class="fas fa-arrow-left"></i></a>
      <h1>Subject load</h1>
    </div>

    <div id="notice" class="notice" hidden></div>

    <div class="who" id="who" hidden>
      <div class="avatar" id="avatar"></div>
      <div>
        <div class="who-name" id="whoName"></div>
        <div class="who-meta" id="whoMeta"></div>
      </div>
    </div>

    <div class="toolbar" id="toolbar" hidden>
      <i class="fas fa-search"></i>
      <input id="search" type="search" placeholder="Search subjects" aria-label="Search subjects">
    </div>

    <div class="grid" id="grid" aria-label="Subjects">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <div class="savebar" id="savebar" hidden>
    <div class="savebar-inner">
      <span>Unsaved changes</span>
      <button type="button" id="discard" class="btn">Discard</button>
      <button type="button" id="save" class="btn primary">Save changes</button>
    </div>
  </div>

  <dialog id="confirmDialog" aria-labelledby="cTitle">
    <div class="dlg">
      <h2 id="cTitle"></h2>
      <p id="cBody"></p>
      <div class="dlg-actions">
        <button type="button" id="cCancel" class="btn">Cancel</button>
        <button type="button" id="cOk" class="btn primary">Confirm</button>
      </div>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
  import {getFirestore, doc, getDoc, updateDoc} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import {getAuth, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCm_DSZaYVQCt0ubBwRkE9nOTryJayxH0w",
    authDomain: "school-in-the-box.firebaseapp.com",
    projectId: "school-in-the-box",
    storageBucket: "school-in-the-box.firebasestorage.app",
    messagingSenderId: "596350496353",
    appId: "1:596350496353:web:84c66c351700ddf0824420",
    measurementId: "G-3MGCDH4FRF"
  };

  const schoolId = "capital";
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);
  const gridEl = $("grid"), searchEl = $("search"), saveBtn = $("save"), discardBtn = $("discard"),
        saveBar = $("savebar"), noticeEl = $("notice"), toastsEl = $("toasts");

  // ---------- feedback helpers (no alert / confirm) ----------
  function toast(text, type = "success") {
    const icons = { success: "fa-circle-check", error: "fa-circle-exclamation", info: "fa-circle-info" };
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.setAttribute("role", type === "error" ? "alert" : "status");
    const icon = document.createElement("i");
    icon.className = "fas " + icons[type];
    const span = document.createElement("span");
    span.textContent = text;
    el.append(icon, span);
    toastsEl.append(el);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, type === "error" ? 6000 : 3500);
  }

  function showNotice(text, type) {
    noticeEl.textContent = text;
    noticeEl.className = "notice " + type;
    noticeEl.hidden = false;
  }

  function confirmDialog({ title, body, confirmText = "Confirm", danger = false }) {
    return new Promise(resolve => {
      const dlg = $("confirmDialog");
      $("cTitle").textContent = title;
      $("cBody").textContent = body;
      const ok = $("cOk");
      ok.textContent = confirmText;
      ok.className = "btn " + (danger ? "danger" : "primary");
      let result = false;
      ok.onclick = () => { result = true; dlg.close(); };
      $("cCancel").onclick = () => dlg.close();
      dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
      dlg.onclose = () => resolve(result);
      dlg.showModal();
    });
  }

  function fatal(text) {
    gridEl.innerHTML = "";
    saveBar.hidden = true;
    showNotice(text, "error");
    throw new Error(text);
  }

  // ---------- load ----------
  const params = new URLSearchParams(window.location.search);
  const teacherId = params.get("username");
  if (!teacherId) fatal("No teacher selected. Open this page from the teacher list.");

  const user = await new Promise(resolve => onAuthStateChanged(auth, user => resolve(user)));
  if (!user) {
    window.location.href = "../signin.html";
    throw new Error("Not signed in");
  }
  const headId = user.email.replace(/@.*/, "");

  // Each teacher has their own document: capital/db/teachersV2/{teacherId}
  const sectionRef = doc(db, schoolId, "section");
  const teacherRef = doc(db, schoolId, "db", "teachersV2", teacherId);
  let sectionDoc, headSnap, teacherSnap;
  try {
    [sectionDoc, headSnap, teacherSnap] = await Promise.all([
      getDoc(sectionRef),
      getDoc(doc(db, schoolId, "db", "teachersV2", headId)),
      getDoc(teacherRef)
    ]);
  } catch (err) {
    console.error(err);
    fatal("Could not load the data (" + (err.code || err.message) + "). Check your connection and reload.");
  }
  if (!headSnap.exists()) fatal("Your account record was not found. Talk to your admin.");
  if (!teacherSnap.exists()) fatal("Teacher record not found: " + teacherId);

  const head = headSnap.data();
  const teacher = teacherSnap.data();
  const rsects = head.role?.hos?.sections ?? [];

  // subject -> classes (across all the head's sections that teach it)
  const subjectDict = new Map();
  if (sectionDoc.exists()) {
    const sections = sectionDoc.data();
    rsects.forEach(key => {
      const section = sections[key];
      if (!section) return;
      const classes = [...(section.classes ?? [])].sort();
      [...(section.subjects ?? [])].forEach(subject => {
        subjectDict.set(subject, (subjectDict.get(subject) ?? []).concat(classes));
      });
    });
  }
  const managed = [...subjectDict.keys()].sort((a, b) => a.localeCompare(b));

  // selected[subject] = classes ticked here. outside[subject] = classes the teacher has for that
  // subject in sections this head doesn't manage; those are left untouched on save.
  const load0 = teacher.load ?? {};
  const selected = new Map(), outside = new Map();
  managed.forEach(subj => {
    const available = new Set(subjectDict.get(subj));
    const current = Array.isArray(load0[subj]) ? load0[subj] : [];
    selected.set(subj, new Set(current.filter(c => available.has(c))));
    outside.set(subj, current.filter(c => !available.has(c)));
  });

  function buildLoad() {
    const out = {};
    Object.keys(load0).forEach(k => { if (!subjectDict.has(k)) out[k] = load0[k]; });  // not ours: keep
    managed.forEach(subj => {
      const all = [...outside.get(subj), ...selected.get(subj)].sort();
      if (all.length) out[subj] = all;                                                   // empty subjects aren't stored
    });
    return out;
  }
  let savedJson = JSON.stringify(buildLoad());

  // ---------- header ----------
  const name = teacher.name ?? teacherId;
  $("avatar").textContent = name.trim().split(/\s+/).slice(0, 2).map(w => w[0] ?? "").join("").toUpperCase() || "?";
  $("whoName").textContent = name;
  $("who").hidden = false;

  function updateMeta() {
    let classes = 0, subjects = 0;
    selected.forEach(set => { if (set.size) { subjects++; classes += set.size; } });
    $("whoMeta").textContent = `@${teacherId} · ${subjects} subject${subjects === 1 ? "" : "s"}, ${classes} class${classes === 1 ? "" : "es"} selected`;
  }

  function updateDirty() {
    saveBar.hidden = JSON.stringify(buildLoad()) === savedJson;
    updateMeta();
  }

  // ---------- subject cards ----------
  const cards = [];
  function buildCard(subj) {
    const classes = [...new Set(subjectDict.get(subj))];
    const card = document.createElement("section");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "card-head";
    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = subj;
    const count = document.createElement("span");
    count.className = "count";
    const allBtn = document.createElement("button");
    allBtn.type = "button"; allBtn.className = "btn small"; allBtn.textContent = "All";
    allBtn.setAttribute("aria-label", `Select all classes for ${subj}`);
    const noneBtn = document.createElement("button");
    noneBtn.type = "button"; noneBtn.className = "btn small"; noneBtn.textContent = "None";
    noneBtn.setAttribute("aria-label", `Clear classes for ${subj}`);
    head.append(title, count, allBtn, noneBtn);

    const chips = document.createElement("div");
    chips.className = "chips";
    const boxes = classes.map(clas => {
      const label = document.createElement("label");
      label.className = "chip";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = selected.get(subj).has(clas);
      const text = document.createElement("span");
      text.textContent = clas;
      label.append(box, text);
      chips.append(label);
      box.onchange = () => {
        if (box.checked) selected.get(subj).add(clas); else selected.get(subj).delete(clas);
        refresh();
      };
      return { clas, box };
    });

    function refresh() {
      const n = selected.get(subj).size;
      count.textContent = `${n} of ${classes.length}`;
      card.classList.toggle("active", n > 0);
      updateDirty();
    }
    allBtn.onclick = () => { boxes.forEach(({ clas, box }) => { box.checked = true; selected.get(subj).add(clas); }); refresh(); };
    noneBtn.onclick = () => { boxes.forEach(({ clas, box }) => { box.checked = false; selected.get(subj).delete(clas); }); refresh(); };

    card.append(head, chips);
    refresh();
    cards.push({ subj, card });
    return card;
  }

  gridEl.innerHTML = "";
  if (!managed.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = rsects.length
      ? "There are no subjects set up for your sections yet."
      : "You are not head of any section, so there are no subjects to assign.";
    gridEl.append(empty);
    if (!rsects.length) showNotice("You are not head of any section.", "info");
    updateMeta();
  } else {
    managed.forEach(subj => gridEl.append(buildCard(subj)));
    $("toolbar").hidden = managed.length < 6;
  }

  searchEl.oninput = () => {
    const q = searchEl.value.trim().toLowerCase();
    cards.forEach(({ subj, card }) => { card.hidden = !!q && !subj.toLowerCase().includes(q); });
  };

  // ---------- save / discard ----------
  saveBtn.onclick = async () => {
    const load = buildLoad();
    saveBtn.disabled = discardBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    try {
      await updateDoc(teacherRef, "load", load);
      savedJson = JSON.stringify(load);
      toast("Subject load saved.");
    } catch (err) {
      console.error(err);
      toast("Save failed: " + (err.code || err.message) + ". Your selections are still here, so you can try again.", "error");
    } finally {
      saveBtn.disabled = discardBtn.disabled = false;
      saveBtn.textContent = "Save changes";
      updateDirty();
    }
  };

  discardBtn.onclick = async () => {
    const ok = await confirmDialog({
      title: "Discard changes?",
      body: "Your unsaved selections will be lost.",
      confirmText: "Discard",
      danger: true
    });
    if (ok) window.location.reload();
  };

  window.addEventListener("beforeunload", e => {
    if (!saveBar.hidden) { e.preventDefault(); e.returnValue = ""; }
  });
  </script>
</body>
</html>
